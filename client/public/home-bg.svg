<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowLeft" cx="0.2" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#c3dbfb" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#c3dbfb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="0.85" cy="0.7" r="0.7">
      <stop offset="0%" stop-color="#a5c9f9" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a5c9f9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1440" height="640" fill="#f5f9fe" />
  <rect width="1440" height="640" fill="url(#glowLeft)" />
  <rect width="1440" height="640" fill="url(#glowRight)" />

  <!-- soft rolling hills along the bottom -->
  <path d="M0 520 C 240 460, 480 560, 720 520 S 1200 460, 1440 520 V640 H0 Z" fill="#e7f0fd" />
  <path d="M0 570 C 300 520, 600 610, 900 570 S 1320 520, 1440 560 V640 H0 Z" fill="#c3dbfb" opacity="0.6" />

  <!-- left speech bubble: German -->
  <g opacity="0.35" transform="translate(120 120)">
    <rect width="170" height="110" rx="24" fill="none" stroke="#0e58be" stroke-width="4" />
    <path d="M40 110 l-6 30 34 -30" fill="none" stroke="#0e58be" stroke-width="4" stroke-linejoin="round" />
    <text x="85" y="72" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#0e58be">De</text>
  </g>

  <!-- right speech bubble: Amharic -->
  <g opacity="0.35" transform="translate(1150 130)">
    <rect width="170" height="110" rx="24" fill="none" stroke="#0e58be" stroke-width="4" />
    <path d="M130 110 l6 30 -34 -30" fill="none" stroke="#0e58be" stroke-width="4" stroke-linejoin="round" />
    <text x="85" y="76" text-anchor="middle" font-family="'Noto Sans Ethiopic', sans-serif" font-size="46" font-weight="bold" fill="#0e58be">አ</text>
  </g>

  <!-- scattered accents -->
  <g fill="#87b6f6" opacity="0.4">
    <circle cx="330" cy="90" r="6" />
    <circle cx="1080" cy="70" r="8" />
    <circle cx="220" cy="330" r="7" />
    <circle cx="1260" cy="330" r="6" />
  </g>
  <g stroke="#a5c9f9" stroke-width="3" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M380 300 q 15 -25 30 0" />
    <path d="M1040 300 q 15 -25 30 0" />
    <path d="M700 80 q 20 -18 40 0" />
  </g>
</svg>